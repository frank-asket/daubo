[project]
name = "daubo-backend"
version = "0.1.0"
description = "Daubo FastAPI backend — LangGraph, OpenRouter, Jina embeddings, pgvector"
requires-python = ">=3.11"
dependencies = [
    "python-multipart>=0.0.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pillow>=11.0.0",
    "tavily-python>=0.7.23",
    "copilotkit>=0.1.86",
    "langgraph-checkpoint-postgres>=3.0.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
