name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@127.0.0.1:5432/daubo
      BACKEND_CORS_ORIGINS: http://localhost:3000
      DAUBO_INTERNAL_API_SECRET: ci_internal_secret
      OPENROUTER_API_KEY: ci_openrouter_key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync backend dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Sync apps/api test dependencies
        working-directory: .
        run: uv sync --project apps/api --extra dev

      - name: Streaming snapshot parity tests (apps/api)
        working-directory: .
        run: PYTHONPATH="$PWD:$PWD/apps/api" uv run --project apps/api pytest apps/api/tests/test_streaming_snapshots.py

      - name: Validate Railway required env contract
        working-directory: .
        run: npm run check:env:railway

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      DAUBO_API_URL: https://api.example.test
      DAUBO_INTERNAL_API_SECRET: ci_internal_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Vercel required env contract
        run: npm run check:env:vercel
